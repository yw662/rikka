name: Sync Wiki

on:
  push:
    branches:
      - default
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docs/wiki to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          TMP_DIR=$(mktemp -d)

          git clone --depth 1 "$WIKI_URL" "$TMP_DIR"
          rsync -av --delete --exclude='.git' docs/wiki/ "$TMP_DIR/"

          cd "$TMP_DIR"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync"
            exit 0
          fi

          git add -A
          git commit -m "docs(wiki): sync from main repository"
          git push
