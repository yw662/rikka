name: Sync Wiki

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docs/wiki/**'

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync to Wiki
        uses: AlexAxelsen/sync-to-wiki@v1
        with:
          source: 'docs/wiki'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: "docs(wiki): sync from main repository"
