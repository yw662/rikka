name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: 类型检查
  typecheck:
    name: 🔍 TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all projects
        run: |
          echo "📋 Checking rikka-signal..."
          pnpm exec tsc --noEmit --project utils/rikka-signal/tsconfig.json
          echo "✅ rikka-signal passed"

          echo "📋 Checking rikka-dom..."
          pnpm exec tsc --noEmit --project utils/rikka-dom/tsconfig.json
          echo "✅ rikka-dom passed"

          echo "📋 Checking rikka-elements..."
          pnpm exec tsc --noEmit --project utils/rikka-elements/tsconfig.json
          echo "✅ rikka-elements passed"

          echo "📋 Checking rikka-live-playground..."
          pnpm exec tsc --noEmit --project components/rikka-live-playground/tsconfig.json
          echo "✅ rikka-live-playground passed"

          echo "📋 Checking rikka-homepage..."
          pnpm exec tsc --noEmit --project docs/rikka-homepage/tsconfig.json
          echo "✅ rikka-homepage passed"

          echo "📋 Checking examples/bookmark-manager..."
          pnpm exec tsc --noEmit --project examples/bookmark-manager/tsconfig.json
          echo "✅ bookmark-manager passed"

          echo "📋 Checking examples/code-editor..."
          pnpm exec tsc --noEmit --project examples/code-editor/tsconfig.json
          echo "✅ code-editor passed"

          echo "📋 Checking examples/finance-tracker..."
          pnpm exec tsc --noEmit --project examples/finance-tracker/tsconfig.json
          echo "✅ finance-tracker passed"

          echo ""
          echo "================================"
          echo "🎉 All type checks passed!"
          echo "================================"

  # Job 2: 构建项目
  build:
    name: 🏗️ Build Project
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            utils/*/dist/
            components/*/dist/
            docs/rikka-homepage/dist/
          retention-days: 7

  # Job 3: 运行测试
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: pnpm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            utils/*/coverage/
            components/*/coverage/
          retention-days: 30
