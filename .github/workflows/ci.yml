name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PNPM_VERSION: "10.33.4"

jobs:
  # Job 1: 类型检查
  typecheck:
    name: 🔍 TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all projects
        run: |
          echo "📋 Checking rikka-signal..."
          pnpm exec tsc --noEmit --project utils/rikka-signal/tsconfig.json
          echo "✅ rikka-signal passed"

          echo "📋 Checking rikka-dom..."
          pnpm exec tsc --noEmit --project utils/rikka-dom/tsconfig.json
          echo "✅ rikka-dom passed"

          echo "📋 Checking rikka-elements..."
          pnpm exec tsc --noEmit --project utils/rikka-elements/tsconfig.json
          echo "✅ rikka-elements passed"

          echo "📋 Checking rikka-live-playground..."
          pnpm exec tsc --noEmit --project components/rikka-live-playground/tsconfig.json
          echo "✅ rikka-live-playground passed"

          echo "📋 Checking rikka-demo..."
          pnpm exec tsc --noEmit --project docs/rikka-demo/tsconfig.json
          echo "✅ rikka-demo passed"

          echo "📋 Checking examples/bookmark-manager..."
          pnpm exec tsc --noEmit --project examples/bookmark-manager/tsconfig.json
          echo "✅ bookmark-manager passed"

          echo "📋 Checking examples/code-editor..."
          pnpm exec tsc --noEmit --project examples/code-editor/tsconfig.json
          echo "✅ code-editor passed"

          echo "📋 Checking examples/finance-tracker..."
          pnpm exec tsc --noEmit --project examples/finance-tracker/tsconfig.json
          echo "✅ finance-tracker passed"

          echo ""
          echo "================================"
          echo "🎉 All type checks passed!"
          echo "================================"

  # Job 2: 构建项目
  build:
    name: 🏗️ Build Project
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            utils/*/dist/
            components/*/dist/
            docs/rikka-demo/dist/
          retention-days: 7

  # Job 3: 运行测试
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: pnpm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  # Job 4: 浏览器测试 (E2E)
  browser-test:
    name: 🌐 Browser E2E Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build demo site
        run: pnpm build

      - name: Start demo server
        run: pnpm demo &
        env:
          PORT: 3000

      - name: Wait for server to start
        run: sleep 5

      - name: Run E2E tests
        run: |
          echo "Running basic smoke tests on demo server..."
          curl -sf http://localhost:3000/ > /dev/null && echo "✅ Homepage is accessible" || exit 1
          echo "Browser E2E tests completed successfully!"

  # Job 5: 发布到 GitHub Packages (仅在推送 tag 时触发)
  publish:
    name: 🚀 Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [build, test, browser-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish packages
        run: |
          echo "📦 Publishing packages to GitHub Packages..."
          cd utils/rikka-signal && npm publish --access public --tag latest
          cd ../rikka-dom && npm publish --access public --tag latest
          cd ../rikka-elements && npm publish --access public --tag latest
          cd ../../components/rikka-live-playground && npm publish --access public --tag latest
          echo "✅ All packages published successfully!"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
