<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rikka Web Agent — WebLLM 集成测试</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      padding: 2rem 1rem 0.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: #e8e8f0;
    }
    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      padding: 0 1rem;
    }
    .test-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .test-cell {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .test-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .test-box {
      height: 520px;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      overflow: hidden;
    }
    rikka-web-agent {
      display: block;
      height: 100%;
    }
    .webllm-note {
      max-width: 1200px;
      margin: 0 auto 2rem;
      padding: 1rem;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      font-size: 0.8125rem;
      color: #9ca3af;
    }
    .webllm-note strong {
      color: #6366f1;
    }
    @media (max-width: 768px) {
      .test-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>Rikka Web Agent — WebLLM 集成测试</h1>
  <p class="subtitle">点击设置按钮，选择接入方式：API · Browser AI · WebLLM</p>

  <div class="webllm-note">
    <strong>WebLLM 说明：</strong>
    WebLLM 需要 Cross-Origin-Isolation（COEP/COOP headers）才能使用 SharedArrayBuffer。
    当前服务器已正确配置这些 headers。<br>
    选择 WebLLM 后，模型会在后台下载（约 1-4GB），下载进度会显示在聊天界面中。
    首次下载后模型会被缓存，再次使用时无需重新下载。
  </div>

  <div class="test-grid">
    <!-- Floating agent -->
    <div class="test-cell">
      <div class="test-label">浮动模式（右下角）</div>
      <div class="test-box">
        <rikka-web-agent layout="floating"></rikka-web-agent>
      </div>
    </div>

    <!-- Embedded agent -->
    <div class="test-cell">
      <div class="test-label">嵌入式</div>
      <div class="test-box">
        <rikka-web-agent layout="embedded"></rikka-web-agent>
      </div>
    </div>

    <!-- Popup agent -->
    <div class="test-cell">
      <div class="test-label">弹窗模式（居中覆盖）</div>
      <div class="test-box">
        <rikka-web-agent layout="popup"></rikka-web-agent>
      </div>
    </div>

    <!-- Sidebar agent -->
    <div class="test-cell">
      <div class="test-label">侧边栏模式（右侧）</div>
      <div class="test-box">
        <rikka-web-agent layout="sidebar"></rikka-web-agent>
      </div>
    </div>
  </div>

</body>
</html>
