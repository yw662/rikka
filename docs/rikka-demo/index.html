<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Rikka</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0d1117;
      color: #e2e8f0;
      line-height: 1.6;
    }
  </style>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      var el = document.createElement('pre');
      el.style.cssText = 'color:#ff6b6b;padding:20px;font-size:14px;white-space:pre-wrap;background:#1a1a2e;margin:10px;border-radius:8px;border:1px solid #ff6b6b;';
      el.textContent = 'JS Error: ' + msg + '\n' + url + ':' + line + ':' + col + '\n' + (error && error.stack || '');
      document.body.appendChild(el);
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.createElement('pre');
      el.style.cssText = 'color:#ff6b6b;padding:20px;font-size:14px;white-space:pre-wrap;background:#1a1a2e;margin:10px;border-radius:8px;border:1px solid #ff6b6b;';
      el.textContent = 'Unhandled Promise: ' + (e.reason && e.reason.stack || e.reason);
      document.body.appendChild(el);
    });
  </script>
</head>
<body>
  <rikka-app></rikka-app>
</body>
</html>
